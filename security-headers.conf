# Included from every location that sets its own add_header.
#
# nginx does NOT inherit add_header from an outer level into a block that
# declares any add_header of its own — the whole inherited set is dropped.
# Both the static-asset location and /health add their own headers, so without
# this include they served no CSP, no HSTS, no nosniff.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
